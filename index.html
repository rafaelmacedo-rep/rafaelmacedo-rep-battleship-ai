<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battleship vs AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Battleship</h1>
      <p id="status" class="status">Place your Carrier (5 cells)</p>
      <p id="remaining" class="remaining"></p>
    </header>

    <main>
      <section class="board-panel">
        <h2>Your fleet</h2>
        <div id="player-grid" class="grid" aria-label="Your board"></div>
      </section>

      <section class="board-panel">
        <h2>Enemy waters</h2>
        <div id="ai-grid" class="grid" aria-label="Enemy board"></div>
      </section>

      <section class="side-panel">
        <div class="controls">
          <button type="button" id="rotate">Rotate (<span id="orientation">Horizontal</span>)</button>
          <button type="button" id="random">Random placement</button>
          <button type="button" id="reset">Reset</button>
          <button type="button" id="start">Start game</button>
          <button type="button" id="play-again" hidden>Play again</button>
        </div>

        <h2>Fleet</h2>
        <ul id="fleet-list" class="fleet"></ul>

        <h2>Log</h2>
        <ul id="log" class="log"></ul>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
